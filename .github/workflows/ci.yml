name: ForgeAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: forgeai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test, evaluate, and build
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts migrations

      - name: Migration smoke test
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=forgeai --cov-report=term-missing

      - name: Evaluation benchmark
        run: python scripts/run_eval.py --output artifacts/benchmark.json

      - name: Security evaluation
        run: python scripts/run_security_eval.py --output artifacts/security.json

      - name: Verify evaluation evidence
        run: python scripts/verify_evidence.py --benchmark artifacts/benchmark.json --security artifacts/security.json

      - name: Docker build
        run: docker build -t forgeai:ci .

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forgeai-evaluation-evidence
          path: artifacts/*.json
          if-no-files-found: error
