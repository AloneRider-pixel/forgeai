name: ForgeAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, evaluate, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts migrations

      - name: Migration smoke test
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=forgeai --cov-report=term-missing

      - name: Evaluation benchmark
        run: python scripts/run_eval.py --output artifacts/benchmark.json

      - name: Security evaluation
        run: python scripts/run_security_eval.py --output artifacts/security.json

      - name: Docker build
        run: docker build -t forgeai:ci .

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forgeai-evaluation-evidence
          path: artifacts/*.json
          if-no-files-found: error
